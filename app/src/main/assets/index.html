<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Расход энергии</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#16202c;--mute:#6a7686;--line:#dfe4ea;--acc:#1f3a5f;--acc2:#ffc83d;--ok:#1d7a4a;--warn:#b5651d;--field:#f7f9fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#18202a;--ink:#e8edf3;--mute:#93a1b2;--line:#2a3542;--acc:#7fb0ff;--acc2:#ffc83d;--ok:#5fd19a;--warn:#f0a35e;--field:#121921}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
header{background:#1f3a5f;color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:600;flex:1}
header .bolt{color:var(--acc2);font-size:22px}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
main{padding:12px 12px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 10px;font-weight:600}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 4px;border-radius:9px;font-size:15px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{color:#0f141a}}
.row{display:flex;gap:10px;margin-top:10px}
.row>label{flex:1;min-width:0}
label span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:20px;padding:6px 11px;font-size:13px}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.btn{border:0;border-radius:11px;padding:11px 14px;font-size:15px;background:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#0f141a}}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.warn{font-size:13px;color:var(--warn);margin-top:8px}
.big{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.big b{font-size:34px;font-variant-numeric:tabular-nums}
.big small{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.money{color:var(--ok);font-weight:600}
.list .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item div{flex:1;min-width:0}
.list .item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .item small{color:var(--mute)}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;padding:4px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:11px;padding:11px 12px;margin-top:8px;font-size:14px}
.opt b{float:right;color:var(--ok);margin-left:8px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
</style>
</head>
<body>
<header><span class="bolt">⚡</span><h1>Расход энергии</h1><button id="btnList">Сохранённые</button></header>
<main>

<div class="card">
  <h2>Сеть</h2>
  <div class="seg" id="segPhase">
    <button data-v="1">Однофазный</button>
    <button data-v="3">Трёхфазный</button>
  </div>
  <div class="row">
    <label><span id="lblU">Напряжение, В</span><input id="U" inputmode="decimal"></label>
  </div>
  <div class="hint" id="hintU"></div>
</div>

<div class="card">
  <h2>Ток</h2>
  <div class="row" id="rowI">
    <label id="wL1"><span id="lblI1">L1, А</span><input id="I1" inputmode="decimal" placeholder="0"></label>
    <label id="wL2"><span>L2, А</span><input id="I2" inputmode="decimal" placeholder="= L1"></label>
    <label id="wL3"><span>L3, А</span><input id="I3" inputmode="decimal" placeholder="= L1"></label>
  </div>
  <div class="hint" id="hintI">Пустое поле L2/L3 считается равным L1.</div>
  <div class="warn" id="warnI"></div>
</div>

<div class="card">
  <h2>Тип нагрузки (cos φ)</h2>
  <div class="chips" id="chipsCos">
    <button class="chip" data-v="1">Нагреватели 1,0</button>
    <button class="chip" data-v="0.9">Смешанная 0,9</button>
    <button class="chip" data-v="0.85">Двигатели 0,85</button>
    <button class="chip" data-v="0.75">Недогруж. двигатели 0,75</button>
  </div>
  <div class="row">
    <label><span>cos φ</span><input id="cos" inputmode="decimal"></label>
  </div>
</div>

<div class="card">
  <h2>Режим работы и тариф</h2>
  <div class="row">
    <label><span>Часов в сутки</span><input id="hours" inputmode="decimal"></label>
    <label><span>Дней в месяц</span><input id="days" inputmode="decimal"></label>
  </div>
  <div class="row">
    <label><span>Тариф, сум за кВт·ч</span><input id="tariff" inputmode="decimal"></label>
  </div>
  <div class="row"><button class="btn ghost" id="btnTariff" style="flex:1">🔎 Найти тариф в интернете</button></div>
  <div class="hint" id="hintT"></div>
</div>

<div class="card">
  <h2>Результат</h2>
  <div class="big"><b id="rP">0</b><small>кВт активной мощности</small></div>
  <div class="hint" id="rS" style="margin:0 0 8px"></div>
  <table>
    <thead><tr><th>Период</th><th>кВт·ч</th><th>Сумма, сум</th></tr></thead>
    <tbody id="rT"></tbody>
  </table>
  <div class="actions">
    <button class="btn ghost" id="btnSave">💾 Сохранить</button>
    <button class="btn" id="btnShare">📤 Отправить</button>
  </div>
</div>

<div class="hint" style="text-align:center">Трёхфазная сеть: P = U<sub>л</sub>/√3 × (I1+I2+I3) × cos φ<br>Однофазная: P = U × I × cos φ</div>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const num=v=>{v=String(v||'').replace(/\s/g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:NaN};
const fmt=(n,d=1)=>isFinite(n)?n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const fmt0=n=>isFinite(n)?Math.round(n).toLocaleString('ru-RU'):'—';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let st=Object.assign({phase:3,U:'380',I1:'',I2:'',I3:'',cos:'0.9',hours:'24',days:'30',tariff:'1100',U1:'220',U3:'380'},store.get('state',{}));

function apply(){
  document.querySelectorAll('#segPhase button').forEach(b=>b.classList.toggle('on',+b.dataset.v===st.phase));
  ['U','I1','I2','I3','cos','hours','days','tariff'].forEach(k=>{if(document.activeElement!==$(k))$(k).value=st[k]});
  const three=st.phase===3;
  $('wL2').style.display=$('wL3').style.display=three?'':'none';
  $('lblI1').textContent=three?'L1, А':'Ток, А';
  $('hintI').style.display=three?'':'none';
  $('lblU').textContent=three?'Линейное напряжение (между фазами), В':'Напряжение, В';
  $('hintU').textContent=three?'Обычно 380 В (фаза–фаза).':'Обычно 220 В (фаза–ноль).';
  document.querySelectorAll('#chipsCos .chip').forEach(c=>c.classList.toggle('on',num(c.dataset.v)===num(st.cos)));
  calc();
}

function calc(){
  const U=num(st.U),cos=num(st.cos),h=num(st.hours),d=num(st.days),t=num(st.tariff);
  const i1=num(st.I1)||0;
  let P,S,warn='';
  if(st.phase===3){
    const i2=st.I2===''?i1:(num(st.I2)||0),i3=st.I3===''?i1:(num(st.I3)||0);
    const sum=i1+i2+i3;
    S=U/Math.sqrt(3)*sum/1000;
    const avg=sum/3,mx=Math.max(i1,i2,i3),mn=Math.min(i1,i2,i3);
    if(avg>0&&(mx-mn)/avg>0.15)warn='⚠ Перекос токов по фазам '+fmt((mx-mn)/avg*100,0)+' % — проверь нагрузку и сеть.';
  } else S=U*i1/1000;
  P=S*cos;
  $('warnI').textContent=warn;
  $('rP').textContent=fmt(P,2);
  $('rS').textContent=isFinite(S)?'Полная мощность '+fmt(S,2)+' кВА':'';
  const rows=[['1 час',P*1],['Сутки ('+fmt(h,0)+' ч)',P*h],['Месяц ('+fmt(d,0)+' дн.)',P*h*d],['Год',P*h*d*12]];
  $('rT').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1],1)}</td><td class="money">${isFinite(t)?fmt0(r[1]*t):'—'}</td></tr>`).join('');
  st._P=P;st._S=S;st._rows=rows;
  store.set('state',st);
}

document.querySelectorAll('#segPhase button').forEach(b=>b.onclick=()=>{
  const p=+b.dataset.v;if(p===st.phase)return;
  if(st.phase===3)st.U3=st.U;else st.U1=st.U;
  st.phase=p;st.U=p===3?(st.U3||'380'):(st.U1||'220');apply();
});
['U','I1','I2','I3','cos','hours','days','tariff'].forEach(k=>$(k).addEventListener('input',e=>{st[k]=e.target.value;
  if(k==='cos')document.querySelectorAll('#chipsCos .chip').forEach(c=>c.classList.toggle('on',num(c.dataset.v)===num(st.cos)));
  calc();}));
document.querySelectorAll('#chipsCos .chip').forEach(c=>c.onclick=()=>{st.cos=c.dataset.v;apply()});

/* ---------- модальное окно ---------- */
function openSheet(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeSheet(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};
window.onBack=()=>{if($('modal').classList.contains('show')){closeSheet();return true}return false};

/* ---------- поиск тарифа ---------- */
const SOURCES=[
  {name:'goldenpages.uz',url:'https://www.goldenpages.uz/electroenergy/'},
  {name:'buxgalter.uz',url:'https://buxgalter.uz/publish/doc/text203977_skolko_platyat_za_kommunalnye_uslugi_yuridicheskie_lica_v_uzbekistane_deystvuyushchie_tarify'}
];
function stripHtml(s){return s.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<br\s*\/?>/gi,' ').replace(/<\/(td|th)>/gi,' | ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&#\d+;|&\w+;/g,' ').replace(/[\s ]+/g,' ').trim()}
function parseTariffs(html,src){
  const out=[];
  const rows=html.split(/<tr[\s>]/i).slice(1).map(r=>stripHtml(r.split(/<\/tr>/i)[0]));
  for(const r of rows){
    if(!/(групп|юрид|предприят|потребител)/i.test(r))continue;
    if(/(куб|газ|м3|м³)/i.test(r))continue;
    const m=[...r.matchAll(/(\d{1,2}[\s ]?\d{3}|\d{3,4})(?:[,.]\d+)?\s*(?:сум|сўм)?/gi)].map(x=>parseInt(x[1].replace(/\D/g,''))).filter(v=>v>=200&&v<=5000);
    if(!m.length)continue;
    const price=m[m.length-1];
    let label=r.replace(/\|/g,' ').replace(/\s+/g,' ').trim();
    if(label.length>140)label=label.slice(0,140)+'…';
    if(!out.some(o=>o.price===price&&o.label===label))out.push({price,label,src});
    if(out.length>=8)break;
  }
  return out;
}
let pending=0,found=[];
window._tariffCb=[];
$('btnTariff').onclick=()=>{
  if(!window.Android){$('hintT').textContent='Поиск работает только в приложении.';return}
  $('hintT').textContent='Ищу актуальный тариф…';found=[];pending=SOURCES.length;
  SOURCES.forEach((s,i)=>{
    window['_tcb'+i]=txt=>{
      if(!txt.startsWith('ERROR:'))found.push(...parseTariffs(txt,s.name));
      if(--pending===0)showTariffs();
    };
    Android.fetch(s.url,'_tcb'+i);
  });
};
function showTariffs(){
  if(!found.length){$('hintT').textContent='Не удалось найти тариф (нет интернета или сайт изменился). Введите вручную.';return}
  $('hintT').textContent='';
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  openSheet(`<h3>Найденные тарифы</h3><div class="hint">Выберите подходящую группу потребителей. Предприятия обычно — группа II («другие юридические лица»). Проверьте по договору с энергосбытом.</div>`+
    found.map((f,i)=>`<button class="opt" data-i="${i}"><b>${f.price.toLocaleString('ru-RU')} сум</b>${esc(f.label)}<br><small style="color:var(--mute)">${f.src}</small></button>`).join('')+
    `<div class="actions"><button class="btn ghost" onclick="closeSheet()">Ввести вручную</button></div>`);
  document.querySelectorAll('#sheet .opt').forEach(b=>b.onclick=()=>{st.tariff=String(found[+b.dataset.i].price);closeSheet();apply();$('hintT').textContent='Тариф взят с '+found[+b.dataset.i].src+'.'});
}

/* ---------- сохранённые потребители ---------- */
function summary(){
  const ph=st.phase===3?`3 фазы, ${st.U} В, ток ${st.I1||0}/${st.I2===''?st.I1||0:st.I2}/${st.I3===''?st.I1||0:st.I3} А`:`1 фаза, ${st.U} В, ток ${st.I1||0} А`;
  return ph+`, cos φ ${st.cos}`;
}
$('btnSave').onclick=()=>{
  openSheet(`<h3>Сохранить потребителя</h3><label><span>Название</span><input id="saveName" placeholder="Например: Станок №5"></label>
  <div class="actions"><button class="btn ghost" onclick="closeSheet()">Отмена</button><button class="btn" id="saveOk">Сохранить</button></div>`);
  setTimeout(()=>$('saveName').focus(),50);
  $('saveOk').onclick=()=>{
    const name=$('saveName').value.trim()||'Без названия';
    const list=store.get('list',[]);
    const {phase,U,I1,I2,I3,cos,hours,days,tariff}=st;
    list.unshift({name,phase,U,I1,I2,I3,cos,hours,days,tariff,P:st._P,date:new Date().toLocaleDateString('ru-RU')});
    store.set('list',list);closeSheet();
  };
};
$('btnList').onclick=showList;
function showList(){
  const list=store.get('list',[]);
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const total=list.reduce((a,x)=>a+(x.P||0),0);
  openSheet(`<h3>Сохранённые потребители</h3>`+(list.length?`<div class="hint">Всего: ${fmt(total,2)} кВт · ${fmt(total*24,0)} кВт·ч в сутки (если все работают круглосуточно)</div><div class="list">`+
    list.map((x,i)=>`<div class="item"><div data-i="${i}"><b>${esc(x.name)}</b><small>${x.phase} ф · ${esc(x.U)} В · ${fmt(x.P,2)} кВт · ${esc(x.date)}</small></div><button class="x" data-del="${i}">✕</button></div>`).join('')+`</div>`
    :`<div class="hint">Пока пусто. Нажмите «Сохранить» под результатом.</div>`)+
    `<div class="actions"><button class="btn ghost" onclick="closeSheet()">Закрыть</button></div>`);
  document.querySelectorAll('#sheet .item div').forEach(d=>d.onclick=()=>{const x=list[+d.dataset.i];Object.assign(st,{phase:x.phase,U:x.U,I1:x.I1,I2:x.I2,I3:x.I3,cos:x.cos,hours:x.hours,days:x.days,tariff:x.tariff});closeSheet();apply()});
  document.querySelectorAll('#sheet .x').forEach(b=>b.onclick=()=>{if(!confirm('Удалить «'+list[+b.dataset.del].name+'»?'))return;list.splice(+b.dataset.del,1);store.set('list',list);showList()});
}

/* ---------- отправка ---------- */
$('btnShare').onclick=()=>{
  const t=num(st.tariff);
  const txt='⚡ Расчёт потребления\n'+summary()+'\nМощность: '+fmt(st._P,2)+' кВт ('+fmt(st._S,2)+' кВА)\nТариф: '+fmt0(t)+' сум/кВт·ч\n\n'+
    st._rows.map(r=>r[0]+': '+fmt(r[1],1)+' кВт·ч — '+fmt0(r[1]*t)+' сум').join('\n');
  if(window.Android)Android.share(txt);else if(navigator.share)navigator.share({text:txt});else alert(txt);
};

apply();
</script>
</body>
</html>
